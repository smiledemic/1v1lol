    // console stack is only the Unity logger (post-catch). We wrap that import (found by its `new ExceptionInfo`
    // body) to SNAPSHOT the stack AT THROW TIME into window.__lastThrow, but log NOTHING per-throw. Then when
    // the matching error is actually LOGGED, we print that throw-site stack ONCE per unique site (quiet).
    // Ghidra-map the raw offsets (ram=0x80000000+offset). Toggle off: CXATRACE=0.
    // ★2026-06-12 PERF: was Infinity, every Error creation captured unbounded stacks (expensive when IL2CPP
    // throws per-frame, e.g. the BR-scene AOOR). THROWSITE only reads ~15 frames (slice(1,15)); 40 is plenty.
    try { Error.stackTraceLimit = 40; } catch(e){}

          // It's harmless audio-engine noise, but routing every call through _pushLog + the (very slow in Chrome)
          // real console.error AMPLIFIES it into real main-thread lag. Suppress fast: count the first few, then
          // drop entirely (toggle FMODLOG=1 to see them). This is pure log-noise suppression, the WASM DSP
          // attempts themselves are unchanged, but the JS-side per-call cost (the actual lag source) is gone.
          var a0 = arguments[0];
          if (typeof a0 === 'string' && a0.indexOf('FMOD returns error code') >= 0) {
            _errN.FMOD = (_errN.FMOD || 0) + 1;
            if (_errN.FMOD === 4) _oe('%c[THROTTLE] suppressing FMOD audio-error spam (toggle: FMODLOG=1)', 'color:#f80');
            try { if (_errN.FMOD > 3 && localStorage.getItem('FMODLOG') !== '1') return; } catch(e){ if (_errN.FMOD > 3) return; }
          }
          // ★2026-06-12 PERF: emscripten "FS.syncfs operations in flight at once" warnings spam during gameplay
          // (IndexedDB sync). Each console.error with DevTools open renders a MULTI-THOUSAND-frame async rAF
          // stack (~288k log lines per session) → main-thread jank, "teleporting" camera. Same throttle pattern.
          if (typeof a0 === 'string' && a0.indexOf('FS.syncfs operations in flight') >= 0) {
            _errN.SYNCFS = (_errN.SYNCFS || 0) + 1;
            if (_errN.SYNCFS === 3) _oe('%c[THROTTLE] suppressing FS.syncfs warning spam (toggle: SYNCFSLOG=1)', 'color:#f80');
            try { if (_errN.SYNCFS > 2 && localStorage.getItem('SYNCFSLOG') !== '1') return; } catch(e){ if (_errN.SYNCFS > 2) return; }
          }
          var msg=''; for (var i=0;i<arguments.length;i++){ msg += ' ' + String(arguments[i]); }
          var m = (msg.indexOf('ArgumentOutOfRange')>=0) ? 'AOOR'
                : (msg.indexOf('Sequence contains no elements')>=0) ? 'SEQ-EMPTY'
                : (msg.indexOf('IndexOutOfRange')>=0) ? 'IOOR'
                : (msg.indexOf('NullReference')>=0) ? 'NRE' : null;
          if (m) {
            if (window.__lastThrow) {
              var key = m + '|' + window.__lastThrow.split('\n').slice(1,15).join('|');
              if (!seen[key]) { seen[key]=1; _oe('[THROWSITE ' + m + '] real throw stack:\n' + window.__lastThrow); }
              // ★2026-06-12: CONSUME the capture, some managed throws bypass ___cxa_throw, and a stale
              // __lastThrow then got attributed to the WRONG exception (post-match SEQ-EMPTY printed the
              // boot NRE's stack byte-for-byte). One capture = one print; bypassing throws print nothing.
              window.__lastThrow = '';
            }
            // THROTTLE the repetitive per-frame Unity error itself so the log stays readable for diagnosis.
            _errN[m] = (_errN[m] || 0) + 1;
            if (_errN[m] === 4) _oe('%c[THROTTLE] suppressing further "' + m + '" spam (toggle: SPAM=1)', 'color:#f80');
            try { if (_errN[m] > 3 && localStorage.getItem('SPAM') !== '1') return; } catch(e){ if (_errN[m] > 3) return; }
          }
        } catch(_){}
        return _oe.apply(null, arguments);
      };
    })();
    (function(){
      if (window.__CXAHOOK) return; window.__CXAHOOK = 1;
      try { if (localStorage.getItem('CXATRACE') === '0') return; } catch(e){}

            }

  <!--
    URL stability guard (same as 4.23 prod).
    Unity's `_SetUrlPostfix` JSLib (WebGL.framework.js.unityweb) does
    `history.pushState(null, "", params)`. Playtika canonical SPA-analytics hook,
    fired after party/match creation to ping their GA setup. Served at root "/" on
    Playtika it's harmless; in our deployment under `/test-446/` it truncates the URL
    to `/`, breaking reloads/bookmarks/deep-links for logged-in users.
    Trap pushState/replaceState and skip any call originating from _SetUrlPostfix
    (detected via stack frame). The canonical client never reads URL state, so this is
    a pure JS-side side effect. Other history.pushState (legit SPA routing) still works.
  -->
  <script>
  (function(){
    var _origPush = history.pushState;
    var _origReplace = history.replaceState;
    function _isUnityUrlTrack() {
      var stack = '';
      try { throw new Error(); } catch (e) { stack = e.stack || ''; }
      return stack.indexOf('_SetUrlPostfix') !== -1;
    }
    history.pushState = function(state, title, url) {
      if (_isUnityUrlTrack()) return; // suppress Unity Playtika analytics URL mutation
      return _origPush.apply(history, arguments);
    };
    history.replaceState = function(state, title, url) {
      if (_isUnityUrlTrack()) return;
      return _origReplace.apply(history, arguments);
    };
  })();
  </script>

  <!-- v441 RC dispatch. After Unity instance is ready and our setDefaultValues()
       cached the JSON in 'conf', SendMessage('PersistantObjects','ActivateRemoteConfig',json)
       triggers FirebaseConfigHandler.ActivateRemoteConfig which fans out to all 18 handlers. -->
  <script>
    // ★2026-06-03 RC-RACE ROOT CAUSE CONFIRMED (winver decompile + LSMPROBE + multi-agent verify).
    // The splash @10% ("Downloading Assets") was NEVER a BattlePass exception. It is a TIMING RACE:
    //   • `_didGetRemoteConfig` (the LSM bar's first job) is set in exactly ONE place. EGFFAIOLPBN @37160 - //     reached only from AppInitializer.BJINHNBHJLP (GetRemoteConfig stage) @34009.
    //   • BJINHNBHJLP @33994 starts: `if (FirebaseConfigHandler.PMNIEENPMDI) return true;` (early-return @33996
    //     that SKIPS @34009). PMNIEENPMDI is set true UNCONDITIONALLY by ActivateRemoteConfig @21401.
    //   • Our OLD code fired SendMessage(ActivateRemoteConfig) at +1ms → PMNIEENPMDI=true BEFORE the stage ran
    //     → early-return → EGFFAIOLPBN never fires → `_didGetRemoteConfig` stays false forever → splash pinned
    //     @10% (no managed exception, matches the clean log; the "Bad PKCS7 padding" line is unrelated).
    //   • On WebGL the RC proxy (DLJBOHAFEJN.IIHJIDENGDC @21053) is a no-op (no Firebase fetch), so our manual
    //     SendMessage is the ONLY activation, but it must land AT THE RIGHT TIME, not at +1ms.
    // CANONICAL FIX: do NOT pre-set PMNIEENPMDI. Wait until FirebaseManager.DidInit==true. By then BJINHNBHJLP
    // has passed its early-return (PMNIEENPMDI still false), awaited DidInit @34000, called FetchRemoteConfig
    // @34002 (which creates a fresh HAMBJKCHIGL TCS @21393, required, else SetResult NREs on null), and is now
    // parked on `await ACMCMPJGICJ` @34003. Our single ActivateRemoteConfig then runs the handler foreach and
    // HAMBJKCHIGL.SetResult @21418 → the await resolves → @34009 EGFFAIOLPBN → `_didGetRemoteConfig=true` → boot.
    // Gating on DidInit is deadlock-free: ELGBKKFMPBJ @33965 awaits BJINHNBHJLP (GetRemoteConfig) BEFORE
    // BBMCDLDANDN (auth/_CheckIfConnected), so we MUST NOT gate on an auth signal, but DidInit is set by
    // FirebaseManager init independently of (prior to) the GetRemoteConfig stage, so it always arrives.
    // DidInit = static bool @ FirebaseManager_StaticFields+0x28 (class cell 0x9ad118 → SF@classPtr+0x5c;
    // SF+0x24=Instance, +0x28=DidInit, il2cpp.h:69581-69592, consistent with the LSMPROBE/upstream FB read).
    // MUST be fired exactly ONCE (a 2nd ActivateRemoteConfig double-completes FDNPENFOAHN.SetResult @20992).
    window._rcDispatched = false;
    window.onUnityReady = window.onUnityReady || function() {
      if (window._rcDispatched) return;
      var attempts = 0;
      function firebaseDidInit() {
        try {
          var M = window.unityInstance && window.unityInstance.Module; if (!M) return false;
          var h32 = M.HEAPU32, h8 = M.HEAPU8; if (!h32 || !h8) return false;
          var HL = h32.length * 4;
          var cp = h32[0x9ad118 >>> 2] >>> 0; if (cp <= 0x10000 || cp >= HL) return false;   // FirebaseManager classPtr
          var sf = h32[(cp + 0x5c) >>> 2] >>> 0; if (sf <= 0x10000 || sf >= HL) return false; // static_fields
          return h8[sf + 0x28] === 1;                                                          // DidInit
        } catch (e) { return false; }
      }
      var doDispatch = function() {
        try {
          var configJson = JSON.stringify(conf);
          window.unityInstance.SendMessage('PersistantObjects', 'ActivateRemoteConfig', configJson);
          console.log('%c[v446] ActivateRemoteConfig dispatched POST-DidInit (' + configJson.length + ' bytes), canonical RC timing', 'color:#0f8;font-weight:bold');
        } catch (e) {
          console.warn('[v446] ActivateRemoteConfig failed:', e.message);
        }
      };
      var tryDispatch = function() {
        if (window._rcDispatched) return;
        attempts++;
        var ready = window.unityInstance && typeof conf !== 'undefined' && conf;
        if (ready && firebaseDidInit()) {
          window._rcDispatched = true;
          // small margin so BJINHNBHJLP's DidInit-await continuation has run FetchRemoteConfig (new HAMBJKCHIGL)
          setTimeout(doDispatch, 300);
          return;
        }
        if (attempts < 1400) { setTimeout(tryDispatch, 50); return; }   // ~70s budget for DidInit
        // hard fallback: DidInit never observed (read offset wrong / Firebase init failed). Boot is already
        // dead at this point, so deliver RC anyway as a last resort.
        console.error('[v446] FirebaseManager.DidInit never observed after ~70s, dispatching RC as fallback');
        window._rcDispatched = true;
        doDispatch();
      };
      tryDispatch();
    };

                          +dur > 1000 ? 'color:#f44;font-weight:bold' : 'color:#08c');
